<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Esquiva los Bloques: ULTRA</title>
    
    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
</head>
<body>

    <div id="game-container">
        <div id="parallax-bg"></div>
        
        <div id="fog-of-war"></div>

        <div id="flash-layer" style="position:absolute; width:100%; height:100%; z-index:8; pointer-events:none;"></div>
        
        <div id="ui">
            <div class="ui-fila">
                <div>Puntos: <span id="score">0</span></div>
                <div>Nivel: <span id="level-txt">1</span></div>
                <div>Récord: <span id="highscore">0</span></div>
            </div>
            <div id="combo-badge">Combo x1</div>
        </div>

        <div class="carril"></div>
        <div class="carril"></div>
        <div class="carril"></div>

        <div id="jugador">
            <div class="nave-cuerpo"></div>
        </div>

        <div id="game-over-screen">
            <h1>¡CRASH!</h1>
            <p style="margin-bottom: 20px; font-size: 1.2rem;">Puntaje final: <strong id="final-score">0</strong></p>
            
            <div id="registro-record" style="display: none; width: 85%; max-width: 320px; text-align: center; margin-bottom: 15px;">
                <p style="color: #ffd700; font-weight: bold; font-size: 1.1rem; margin-bottom: 8px; text-shadow: 0 0 8px rgba(255, 215, 0, 0.4);">¡NUEVO RÉCORD GLOBAL!</p>
                <input type="text" id="nombre-input" placeholder="Tu Nombre o Nick" maxlength="12">
                <button id="btn-guardar" onclick="guardarPuntaje()">Guardar Récord</button>
            </div>

            <div id="ranking-display"></div>
            
            <button onclick="reiniciarJuego()">Volver a intentar</button>
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script src="game.js"></script>
</body>
</html>
